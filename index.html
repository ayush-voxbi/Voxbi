<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VoxBI - Voice to Business Intelligence</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b1020;
  color:white;
  min-height:100vh;
}

header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #252d45;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.logo span{
  color:#6c63ff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:35px 20px;
}

.hero{
  text-align:center;
  margin-bottom:35px;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero p{
  color:#aab2c8;
  font-size:17px;
  line-height:1.6;
}

.card{
  background:#151c30;
  border:1px solid #29334f;
  border-radius:18px;
  padding:25px;
  margin-bottom:25px;
}

.card h2{
  margin-bottom:15px;
}

textarea{
  width:100%;
  min-height:140px;
  resize:vertical;
  background:#0c1222;
  color:white;
  border:1px solid #303b5c;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  outline:none;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  flex:1;
  margin-top:15px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#6c63ff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

#voiceBtn{
  background:#252d45;
}

#voiceBtn.recording{
  background:#d33;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:20px;
}

.stat{
  background:#0c1222;
  border:1px solid #29334f;
  border-radius:14px;
  padding:20px;
  text-align:center;
}

.stat h3{
  font-size:28px;
  margin-bottom:7px;
}

.stat p{
  color:#9da7bd;
  font-size:13px;
}

.status{
  margin-top:15px;
  color:#9da7bd;
  text-align:center;
}

@media(max-width:650px){
  .hero h1{
    font-size:30px;
  }

  .dashboard{
    grid-template-columns:repeat(2,1fr);
  }

  .buttons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Vox<span>BI</span></div>
</header>

<main class="container">

<section class="hero">
  <h1>Turn Voice Into Business Intelligence</h1>

  <p>
    Speak your field report and VoxBI will convert it
    into useful business data.
  </p>
</section>

<section class="card">

<h2>🎙️ Field Report</h2>

<textarea
id="report"
placeholder="Speak or type your report here...">
</textarea>

<div class="buttons">

<button id="voiceBtn" onclick="startVoice()">
🎙️ Speak Report
</button>

<button onclick="processReport()">
📊 Process Report
</button>

</div>

<div class="status" id="status">
Ready.
</div>

</section>

<section class="card">

<h2>📊 Business Dashboard</h2>

<div class="dashboard">

<div class="stat">
<h3 id="visited">0</h3>
<p>Merchants Visited</p>
</div>

<div class="stat">
<h3 id="interested">0</h3>
<p>Interested</p>
</div>

<div class="stat">
<h3 id="complaints">0</h3>
<p>Complaints</p>
</div>

<div class="stat">
<h3 id="notInterested">0</h3>
<p>Not Interested</p>
</div>

</div>

</section>

</main>

<script>

let recognition;
let isRecording=false;

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice recognition is not supported in this browser. Try Chrome."
    );

    return;
  }

  if(isRecording){

    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang="en-IN";

  recognition.continuous=true;

  recognition.interimResults=true;

  recognition.onstart=function(){

    isRecording=true;

    document.getElementById("voiceBtn").innerText=
      "⏹️ Stop Recording";

    document.getElementById("voiceBtn")
      .classList.add("recording");

    document.getElementById("status").innerText=
      "Listening... Speak your field report.";
  };

  recognition.onresult=function(event){

    let finalText="";

    for(let i=event.resultIndex;i<event.results.length;i++){

      finalText += event.results[i][0].transcript;
    }

    document.getElementById("report").value=
      finalText;
  };

  recognition.onerror=function(){

    document.getElementById("status").innerText=
      "Voice recognition error. Please try again.";
  };

  recognition.onend=function(){

    isRecording=false;

    document.getElementById("voiceBtn").innerText=
      "🎙️ Speak Report";

    document.getElementById("voiceBtn")
      .classList.remove("recording");

    document.getElementById("status").innerText=
      "Voice report captured ✓";
  };

  recognition.start();
}


function processReport(){

  const text=document
    .getElementById("report")
    .value
    .toLowerCase();

  if(!text.trim()){

    alert("Please speak or enter a report first.");

    return;
  }

  document.getElementById("status").innerText=
    "Processing report...";

  setTimeout(()=>{

    const numbers=text.match(/\d+/g)||[];

    const visited=Number(numbers[0])||0;
    const interested=Number(numbers[1])||0;
    const complaints=Number(numbers[2])||0;
    const notInterested=Number(numbers[3])||0;

    document.getElementById("visited").innerText=
      visited;

    document.getElementById("interested").innerText=
      interested;

    document.getElementById("complaints").innerText=
      complaints;

    document.getElementById("notInterested").innerText=
      notInterested;

    document.getElementById("status").innerText=
      "Report processed successfully ✓";

  },700);
}

</script>

</body>
</html>
